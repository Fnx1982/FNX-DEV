<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FNX DEV</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Montserrat',system-ui,sans-serif;background:#0b0b0c;color:#f5f5f6;min-height:100vh;display:grid;place-items:center;padding:24px}
.box{max-width:520px;width:100%;background:#151517;border:1px solid rgba(255,255,255,.1);border-radius:22px;padding:40px 32px;text-align:center}
h1{font-size:1.6rem;font-weight:900;margin-bottom:10px}
p{color:#a3a3ab;line-height:1.65;margin-bottom:22px}
.row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
a{display:inline-block;text-decoration:none;font-weight:700;padding:13px 22px;border-radius:12px}
.p{background:linear-gradient(135deg,#ff7a00,#ff3b1f);color:#fff}
.g{border:1px solid rgba(255,255,255,.16);color:#f5f5f6}
</style>
</head>
<body>
<div class="box">
  <h1 id="t">Pagamento não concluído</h1>
  <p id="d">Nenhum valor foi cobrado. Se teve alguma dúvida ou problema no pagamento, fale com a gente — ajudamos a finalizar.</p>
  <div class="row">
    <a class="p" id="b1" href="/#planos">Tentar novamente</a>
    <a class="g" id="b2" href="https://wa.me/5541995553699" target="_blank" rel="noopener">Falar no WhatsApp</a>
  </div>
</div>
<script>
let lang = 'pt'; try { lang = localStorage.getItem('fnx_lang') || lang; } catch(e){}
if (lang === 'en') {
  document.documentElement.lang = 'en';
  document.getElementById('t').textContent = 'Payment not completed';
  document.getElementById('d').textContent = "You haven't been charged. If you had any question or problem with the payment, talk to us — we'll help you finish.";
  document.getElementById('b1').textContent = 'Try again';
  document.getElementById('b2').textContent = 'Chat on WhatsApp';
}
document.title = (lang === 'en' ? 'Payment not completed' : 'Pagamento não concluído') + ' — FNX DEV';
</script>
</body>
</html>
